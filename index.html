<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<title>Mon Vocabulaire</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Code+Pro:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0e0c; color: #e8e0d0; font-family: 'Playfair Display', Georgia, serif; min-height: 100vh; }

  .header { border-bottom: 1px solid #2a2820; padding: 1.2rem 1.2rem 1rem; }
  .header-top { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
  .app-title { font-size: 1.5rem; font-weight: 400; color: #e8e0d0; }
  .app-subtitle { font-family: 'Source Code Pro', monospace; font-size: 0.65rem; color: #555; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 0.1rem; }
  .header-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .tabs { border-bottom: 1px solid #1e1c18; display: flex; overflow-x: auto; padding: 0 0.5rem; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 0.6rem 0.9rem; font-family: 'Source Code Pro', monospace; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; color: #555; white-space: nowrap; transition: color 0.2s; }
  .tab.active { border-bottom-color: currentColor; }
  .tab-count { font-size: 0.65rem; opacity: 0.7; margin-left: 0.2rem; }
  .mode-toggle { display: flex; background: #141210; border: 1px solid #242018; border-radius: 6px; padding: 0.3rem; gap: 0.3rem; margin-bottom: 1rem; }
  .mode-btn { flex: 1; background: none; border: none; border-radius: 4px; padding: 0.5rem 0.6rem; font-family: 'Source Code Pro', monospace; font-size: 0.72rem; color: #555; cursor: pointer; transition: all 0.2s; text-align: center; }
  .mode-btn.active { background: #1e1c18; color: #d4a853; }
  .form-box { background: #141210; border: 1px solid #242018; border-radius: 6px; padding: 1rem; margin-bottom: 1.2rem; }
  .form-label { font-family: 'Source Code Pro', monospace; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 0.7rem; }
  .form-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }

  .btn-add { background: #d4a853; color: #0f0e0c; border: none; border-radius: 4px; padding: 0.55rem 1.1rem; font-family: 'Source Code Pro', monospace; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  .btn-add:disabled { background: #333; color: #666; cursor: not-allowed; }
  .btn-generate { background: #1e1c18; border: 1px solid #3a3428; color: #c8a84a; border-radius: 4px; padding: 0.55rem 0.9rem; font-family: 'Source Code Pro', monospace; font-size: 0.72rem; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 0.4rem; transition: all 0.2s; }
  .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  .btn-ghost { background: none; border: 1px solid #2a2820; color: #888; border-radius: 4px; padding: 0.45rem 0.9rem; cursor: pointer; font-family: 'Source Code Pro', monospace; font-size: 0.75rem; }
  .btn-danger { background: #c97e7e22; border: 1px solid #c97e7e; color: #c97e7e; border-radius: 4px; padding: 0.45rem 0.9rem; cursor: pointer; font-family: 'Source Code Pro', monospace; font-size: 0.75rem; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .warning-spelling { background: #2a1a0e; border: 1px solid #c98e7e; }

  .btn-export-list { background: #1a1814; border: 1px solid #2a2820; color: #7ec9a0; border-radius: 4px; padding: 0.45rem 0.8rem; font-family: 'Source Code Pro', monospace; font-size: 0.68rem; cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }

  .fc-bar-fill { background: #d4a853; height: 100%; border-radius: 3px; transition: width 0.3s; }
  .btn-text { background: #1e1c18; border: 1px solid #c97eb855; color: #c97eb8; border-radius: 4px; padding: 0.45rem 0.8rem; font-family: 'Source Code Pro', monospace; font-size: 0.68rem; cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .text-input-area { background: #0a0908; border: 1px solid #2a2820; border-radius: 6px; padding: 0.8rem; color: #c8c0b0; font-family: monospace; font-size: 0.8rem; outline: none; width: 100%; resize: vertical; min-height: 140px; line-height: 1.6; }

  .wb-add:disabled { background: #7ec9a022; border-color: #7ec9a0; color: #7ec9a0; cursor: default; } background: #1a1814; border: 1px solid #2a2820; color: #7ec9a0; border-radius: 4px; padding: 0.45rem 0.8rem; font-family: 'Source Code Pro', monospace; font-size: 0.68rem; cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }

<body>
<div id="app"></div>
<script>
const CATEGORIES = [
  { id:"aggettivi",   label:"Aggettivi",   emoji:"✦", color:"#d4a853" },
  { id:"espressioni", label:"Espressioni", emoji:"◈", color:"#7eb8c9" },
  { id:"sostantivi",  label:"Sostantivi",  emoji:"◆", color:"#c97eb8" },
  { id:"verbi",       label:"Verbi",       emoji:"▸", color:"#7ec9a0" },
  { id:"avverbi",     label:"Avverbi",     emoji:"◉", color:"#c98e7e" },
  { id:"altro",       label:"Altro",       emoji:"◌", color:"#9e9e9e" },
];
const STORAGE_KEY   = "mon-vocabulaire-v1";
const API_KEY_STORE = "mon-vocab-apikey";

const LANG_CONFIG = {
  fr: {
    name: "Francese", flag: "🇫🇷", target: "francese", targetNative: "français",
    inputMode_fr: "🇫🇷 Inserisci in francese", inputMode_it: "🇮🇹 Inserisci in italiano",
    promptLang: "francese", photoPromptLang: "francese",
    appTitle: "Mon Vocabulaire",
  },
  en: {
    name: "Inglese", flag: "🇬🇧", target: "inglese", targetNative: "English",
    inputMode_fr: "🇬🇧 Inserisci in inglese", inputMode_it: "🇮🇹 Inserisci in italiano",
    promptLang: "inglese", photoPromptLang: "inglese",
    appTitle: "My Vocabulary",
  },
};
function LC() { return LANG_CONFIG[state.lang] || LANG_CONFIG.fr; }

let state = {
  lang: null,  // "fr" | "en" — chosen on first open
  vocab: {
    fr: { aggettivi:[], espressioni:[], sostantivi:[], verbi:[], avverbi:[], altro:[] },
    en: { aggettivi:[], espressioni:[], sostantivi:[], verbi:[], avverbi:[], altro:[] },
  },
  activeTab: "sostantivi",
  mode: "fr",
  search: "",
  generating: false,
  warning: null,
  showImportExport: false,
  showSettings: false,
  showDeleteConfirm: null,
  showWordModal: null,   // { word object, loading, result }
  showChallenge: null,
  showFlashCards: null,     // { step: 'setup'|'review', mode:'mine'|'new', cards:[], index:0, flipped:false, results:[] }
  showTextAnalysis: null,   // { step: "input"|"loading"|"result", text, pdfBase64, words }
  showPhotoAnalysis: null, // { step: "upload"|"ocr-loading"|"select"|"analyze-loading"|"result", image, ocrText, sentences, selectedSentence, analysis }
  importText: "",
  apiKey: "",
  form: { word:"", translation:"", gender:"", plural:"", feminine:"", usage:"", example:"" },
  itWord: "",
};

// ── PERSISTENCE
const LANG_STORE = "mon-vocab-lang";

function loadState() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) { const v = JSON.parse(r); state.vocab = v.fr ? v : { fr: v, en: { aggettivi:[], espressioni:[], sostantivi:[], verbi:[], avverbi:[], altro:[] } }; } } catch(e){}
  try { const k = localStorage.getItem(API_KEY_STORE); if (k) state.apiKey = k; } catch(e){}
  // lang is always chosen at startup, never persisted
}
function saveVocab() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.vocab)); } catch(e){}
}
function saveLang(l) {
  try { localStorage.setItem(LANG_STORE, l); } catch(e){}
}
function saveApiKey(k) {
  try { localStorage.setItem(API_KEY_STORE, k); } catch(e){}
}

// ── TOAST
let toastTimer = null;
function showToast(msg, type="success") {
  clearTimeout(toastTimer);
  const old = document.getElementById("toast");
  if (old) old.remove();
  const t = document.createElement("div");
  t.id = "toast"; t.className = "toast " + type; t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 3000);
}

// ── API
async function callClaude(prompt, maxTokens) {
  if (!state.apiKey) throw new Error("no-key");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": state.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model:"claude-haiku-4-5-20251001", max_tokens: maxTokens||1000, messages:[{role:"user",content:prompt}] })
  });
  const data = await res.json();
  if (!res.ok) throw new Error((data?.error?.message || "API error "+res.status)+" ["+res.status+"]");
  const text = (data.content||[]).map(b=>b.text||"").join("");
  if (!text) throw new Error("Risposta vuota dall’API");
  return text.replace(/```json|```/g,"").trim();
}

async function callClaudeJSON(prompt) {
  const text = await callClaude(prompt);
  return JSON.parse(text);
}

async function callClaudeWithImage(base64Data, mediaType, prompt) {
  if (!state.apiKey) throw new Error("no-key");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": state.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1500,
      messages: [{
        role: "user",
        content: [
          { type:"image", source:{ type:"base64", media_type: mediaType, data: base64Data } },
          { type:"text", text: prompt }
        ]
      }]
    })
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || "API error " + res.status); }
  const data = await res.json();
  return (data.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
}

async function callClaudeJSONWithImage(base64Data, mediaType, prompt) {
  const text = await callClaudeWithImage(base64Data, mediaType, prompt);
  return JSON.parse(text);
}

async function generateFromFrench() {

  if (!word || state.generating) return;

  try {
    const catLabel = CATEGORIES.find(c=>c.id===state.activeTab)?.label || state.activeTab;
    const isSost = state.activeTab==="sostantivi", isAgg = state.activeTab==="aggettivi";
    const extraS = isSost ? '"gender":"maschile o femminile","plural":"plurale francese",' : "";
    const extraA = isAgg  ? '"feminine":"forma femminile",' : "";
    const lang = LC();
    const p = await callClaudeJSON(
      'Analizza la parola '+lang.target+' "'+word+'" da inserire in "'+catLabel+'". '+
      'Rispondi SOLO JSON: {"spelling_ok":true/false,"spelling_correction":null,"category_ok":true/false,'+
      '"suggested_category":null,"translation":"traduzione italiana",'+extraS+extraA+
      '"usage":"comune|informale|formale|raro","example1_fr":"frase di esempio 1 in '+lang.target+'","example2_fr":"frase di esempio 2 in '+lang.target+'"}'
    );
    // auto-switch category if wrong
    if (!p.category_ok && p.suggested_category) {
      const match = CATEGORIES.find(c => c.label.toLowerCase() === p.suggested_category.toLowerCase());
      if (match) { state.activeTab = match.id; state.warning = { type:"category", suggestion: p.suggested_category }; }
      else state.warning = { type:"category", suggestion: p.suggested_category };
    }
    if (!p.spelling_ok && p.spelling_correction) state.warning = { type:"spelling", suggestion: p.spelling_correction };
    state.form = { ...state.form,
      translation: p.translation || state.form.translation,
      gender:   p.gender   || "", plural:   p.plural   || "",
      feminine: p.feminine || "", usage:    p.usage    || "",
      example:  [p.example1_fr, p.example2_fr].filter(Boolean).join(" — "),
    };
    showToast("Informazioni generate!");
  } catch(e) {
    showToast(e.message==="no-key" ? "⚙ Inserisci la chiave API nelle impostazioni" : "Errore: "+(e.message||"generazione fallita"), "error");
  }
  state.generating = false; render();
}

async function startFlashCards(mode) {
  state.showFlashCards = { step:"loading", mode };
  render();
  try {
    let cards = [];
    if (mode === "mine") {
      const allWords = Object.values(state.vocab[state.lang]).flatMap(ws => ws);
      if (allWords.length === 0) { showToast("Aggiungi prima qualche parola!", "info"); state.showFlashCards = { step:"setup" }; render(); return; }
      // Shuffle and pick up to 15
      cards = allWords.sort(() => Math.random() - 0.5).slice(0, 15).map(w => ({
        word: w.word, translation: w.translation, example: w.example ? w.example.split(" — ")[0] : "",
        gender: w.gender, plural: w.plural, feminine: w.feminine, usage: w.usage,
        imageQuery: encodeURIComponent(w.word.split(" ")[0]),
      }));
      state.showFlashCards = { step:"review", mode, cards, index:0, flipped:false, results:[] };
      render();
    } else {
      // New words — ask Claude
      const lang = LC();
      const known = Object.values(state.vocab[state.lang]).flatMap(ws => ws.map(w => w.word.toLowerCase()));
      const knownStr = known.length ? known.slice(0,40).join(", ") : "nessuna";
      const resultText = await callClaude(
        'Crea 10 flash card con parole utili in '+lang.target+' che non conosco ancora. '+
        'Parole da escludere: '+knownStr+'. '+
        'Scegli parole di uso quotidiano, livello B1-B2. '+
        'Rispondi SOLO JSON: {"cards":[{"word":"parola in '+lang.target+'","translation":"italiano","example":"frase breve in '+lang.target+'","usage":"comune|informale|formale|raro","imageQuery":"parola chiave in inglese per cercare immagine rappresentativa (1-2 parole)"}]}',
        1200
      );
      const jsonMatch = resultText.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error("Risposta non JSON");
      const parsed = JSON.parse(jsonMatch[0]);
      cards = parsed.cards || [];
      if (cards.length === 0) throw new Error("Nessuna card generata");
      state.showFlashCards = { step:"review", mode, cards, index:0, flipped:false, results:[] };
      render();
    }
  } catch(e) {
    showToast(e.message === "no-key" ? "⚙ Inserisci la chiave API" : "Errore: "+e.message, "error");
    state.showFlashCards = { step:"setup" };
    render();
  }
}

function flipCard() {

function answerCard(knew) {
  const fc = state.showFlashCards;
  if (!fc || !fc.cards) return;
  fc.results.push({ word: fc.cards[fc.index].word, knew });
  fc.index++;
  fc.flipped = false;
  if (fc.index >= fc.cards.length) {

  }
  render();
}

async function analyzeTextOrPdf() {
  // Always read fresh text from DOM first, in case oninput didn't sync
  const textEl = document.getElementById("textInputArea");
  if (textEl && state.showTextAnalysis) {
    state.showTextAnalysis.text = textEl.value;
  }

  const ta = state.showTextAnalysis;
  if (!ta) return;

  const textToAnalyze = (ta.text || "").trim();
  if (!ta.pdfBase64 && !textToAnalyze) {
    showToast("Inserisci del testo prima di analizzare", "info");
    return;
  }

  const snapshot = { ...ta, text: textToAnalyze, step:"loading", debugLog:[] };
  state.showTextAnalysis = snapshot;
  render();

  function dbg(msg) {
    snapshot.debugLog.push(msg);
    console.log("[TextAnalysis]", msg);
  }

  try {
    dbg("Avvio analisi, testo: "+textToAnalyze.slice(0,80)+"...");
    dbg("Lingua: "+LC().target+", apiKey presente: "+(!!state.apiKey));
    const lang = LC();
    let resultText;

    if (snapshot.pdfBase64) {
      dbg("Percorso PDF");
      resultText = await callClaudeWithImage(snapshot.pdfBase64, snapshot.pdfMediaType,
        'Leggi questo documento ed estrai le parole o espressioni in '+lang.target+' di livello B2, C1 o C2 (non parole comuni o frequentissime). '+
        'Rispondi SOLO con un oggetto JSON valido senza nient’altro attorno: {"words":[{"word":"forma base","translation":"traduzione italiana","category":"aggettivi|espressioni|sostantivi|verbi|avverbi|altro","level":"B2|C1|C2","gender":"maschile|femminile se sostantivo altrimenti null","plural":"null o plurale","feminine":"null o femminile","usage":"comune|informale|formale|raro","example1_fr":"frase in '+lang.target+'","example2_fr":"altra frase in '+lang.target+'"}]}. Includi 10-25 parole, le più interessanti e utili.'
      );
    } else {
      dbg("Percorso testo, lunghezza: "+textToAnalyze.length);
      const truncated = textToAnalyze.slice(0, 4000);
      resultText = await callClaude(
        'Analizza questo testo in '+lang.target+' e trova parole/espressioni di livello B2, C1 o C2 (non parole comuni). '+
        'Testo: ---\n'+truncated+'\n--- '+
        'Rispondi SOLO con un oggetto JSON valido, niente altro: {"words":[{"word":"forma base","translation":"traduzione italiana","category":"aggettivi|espressioni|sostantivi|verbi|avverbi|altro","level":"B2|C1|C2","gender":"maschile|femminile se sostantivo altrimenti null","plural":"null o forma plurale","feminine":"null o forma femminile","usage":"comune|informale|formale|raro","example1_fr":"frase esempio 1 in '+lang.target+'","example2_fr":"frase esempio 2 in '+lang.target+'"}]}. Max 25 parole, le più utili. Ordina B2 prima.'
      );
    }

    dbg("Risposta API ricevuta, lunghezza: "+resultText.length);
    dbg("Primi 200 chars: "+resultText.slice(0,200));

    const jsonMatch = resultText.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("Nessun JSON nella risposta. Risposta: "+resultText.slice(0,200));
    const parsed = JSON.parse(jsonMatch[0]);
    const words = parsed.words || [];
    dbg("Parole trovate: "+words.length);
    if (words.length === 0) showToast("Nessuna parola B2+ trovata nel testo", "info");
    state.showTextAnalysis = { ...snapshot, step:"result", words };
    render();
  } catch(e) {
    dbg("ERRORE: "+e.message);
    const msg = e.message === "no-key"
      ? "⚙ Inserisci la chiave API nelle impostazioni"
      : "Errore: " + e.message;
    showToast(msg, "error");
    // Show debug log on screen
    state.showTextAnalysis = { ...snapshot, step:"input", debugInfo: snapshot.debugLog.join("\n") };
    render();
  }
}

function importVocab() {
  try {
    const p = JSON.parse(state.importText);
    if (!CATEGORIES.every(c=>Array.isArray(p[c.id]))) throw new Error();
    state.vocab[state.lang]=p; saveVocab(); state.importText=""; state.showImportExport=false;
    showToast(Object.values(p).reduce((s,a)=>s+a.length,0)+" parole importate!"); render();
  } catch(e) { showToast("Dati non validi","error"); }
}

// ── HELPERS
function totalWords() { if (!state.lang) return 0; return Object.values(state.vocab[state.lang]).reduce((s,a)=>s+a.length,0); }
function filteredWords() {
  const q = state.search.toLowerCase();
  if (q) return Object.entries(state.vocab[state.lang]).flatMap(([cat,ws])=>ws.filter(w=>w.word.toLowerCase().includes(q)||w.translation.toLowerCase().includes(q)).map(w=>({...w,cat})));
  return state.vocab[state.lang][state.activeTab].map(w=>({...w,cat:state.activeTab}));
}
function usageBadge(u) {
  if (!u) return "";
  const map = {comune:["#7ec9a0","#7ec9a011","● comune"],informale:["#d4a853","#d4a85311","◐ informale"],formale:["#7eb8c9","#7eb8c911","◈ formale"],raro:["#888","#88888811","○ raro"]};
  const [c,bg,label] = map[u]||["#888","#88888811",u];
  return '<span class="badge" style="color:'+c+';background:'+bg+'">'+label+'</span>';
}
function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function actionLabel(a) {
  return {sinonimo:"💬 Sinonimi", contrario:"↔ Contrari", esempi:"📖 Altri esempi", correggi:"✓ Verifica"}[a]||a;
}

// ── DOWNLOAD LIST AS PDF (via print window)
function downloadList() {
  const totalFr = Object.values(state.vocab.fr).reduce((s,a)=>s+a.length,0);
  const totalEn = Object.values(state.vocab.en).reduce((s,a)=>s+a.length,0);
  const total = totalFr + totalEn;
  if (total === 0) { showToast("Nessuna parola da esportare", "info"); return; }

  const usageMap = {comune:"● comune", informale:"◐ informale", formale:"◈ formale", raro:"○ raro"};

  function buildSection(langVocab, langLabel, langFlag) {
    const langTotal = Object.values(langVocab).reduce((s,a)=>s+a.length,0);
    if (langTotal === 0) return "";
    let html = '<div class="lang-section">';
    html += '<div class="lang-title">'+langFlag+' '+langLabel+' <span class="lang-count">('+langTotal+' parole)</span></div>';
    CATEGORIES.forEach(cat => {
      const words = [...(langVocab[cat.id]||[])].sort((a,b)=>a.word.localeCompare(b.word));
      if (!words.length) return;
      html += '<div class="category"><div class="cat-title" style="color:'+cat.color+'">'+cat.emoji+' '+cat.label+' ('+words.length+')</div>';
      words.forEach(w => {
        html += '<div class="word-entry"><div class="word-head"><span class="word-fr">'+w.word+'</span>';
        if (w.translation) html += '<span class="word-it"> — '+w.translation+'</span>';
        if (w.gender) html += ' <span class="badge '+(w.gender==='femminile'?'badge-f':'badge-m')+'">'+(w.gender==='femminile'?'♀ f.':'♂ m.')+'</span>';
        if (w.usage) html += ' <span class="badge badge-'+w.usage+'">'+(usageMap[w.usage]||w.usage)+'</span>';
        html += '</div>';
        if (w.plural||w.feminine) {
          let x=[]; if(w.plural) x.push('pl. '+w.plural); if(w.feminine) x.push('♀ '+w.feminine);
          html += '<div class="word-extra">'+x.join(' · ')+'</div>';
        }
        if (w.example) w.example.split(' — ').filter(Boolean).forEach(ex=>{ html+='<div class="word-example">« '+ex+' »</div>'; });
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  const body = buildSection(state.vocab.fr, "Francese", "🇫🇷")
             + buildSection(state.vocab.en, "Inglese",  "🇬🇧");

  const css = [
    "@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Code+Pro:wght@300;400&display=swap');",
    "*{box-sizing:border-box;margin:0;padding:0}",
    "body{background:#fff;color:#1a1814;font-family:'Playfair Display',Georgia,serif;padding:2cm;max-width:100%}",
    "h1{font-size:1.8rem;font-weight:400;color:#1a1814;margin-bottom:0.2rem}",
    ".subtitle{font-family:monospace;font-size:0.62rem;color:#888;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:2rem;border-bottom:1px solid #ddd;padding-bottom:0.8rem}",
    ".lang-section{margin-bottom:2.5rem}",
    ".lang-title{font-family:monospace;font-size:0.85rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#1a1814;padding-bottom:0.6rem;border-bottom:3px solid #1a1814;margin-bottom:1.2rem}",
    ".lang-count{font-weight:400;color:#888}",
    ".category{margin-bottom:1.5rem;page-break-inside:avoid;padding-left:0.5rem}",
    ".cat-title{font-family:monospace;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;padding-bottom:0.4rem;border-bottom:2px solid currentColor;margin-bottom:0.8rem;font-weight:600}",
    ".word-entry{padding:0.5rem 0;border-bottom:1px solid #f0ece4;page-break-inside:avoid}",
    ".word-head{display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.1rem}",
    ".word-fr{font-size:0.95rem;color:#1a1814;font-weight:500}",
    ".word-it{font-family:monospace;font-size:0.68rem;color:#777}",
    ".badge{font-family:monospace;font-size:0.52rem;letter-spacing:0.06em;text-transform:uppercase;padding:0.1rem 0.3rem;border-radius:3px;border:1px solid currentColor}",
    ".badge-m{color:#2e7d9e}.badge-f{color:#9e4e8a}.badge-comune{color:#3a8a5a}.badge-informale{color:#9a7a2a}.badge-formale{color:#2e6e9e}.badge-raro{color:#777}",
    ".word-extra{font-family:monospace;font-size:0.6rem;color:#999;margin-top:0.1rem}",
    ".word-example{font-style:italic;font-size:0.75rem;color:#888;margin-top:0.15rem}",
    ".footer{font-family:monospace;font-size:0.55rem;color:#bbb;margin-top:2rem;padding-top:0.8rem;border-top:1px solid #eee;letter-spacing:0.1em}",
    "@media print{body{padding:1.5cm} @page{margin:1.5cm} .lang-section{page-break-before:auto}}"

  const dateStr = new Date().toLocaleDateString('it-IT');

  const win = window.open('','_blank','width=800,height=900');
  if (!win) { showToast("Popup bloccato — abilita i popup per questo sito", "error"); return; }

  win.document.close();

// ── SFIDA GIORNALIERA (parole esistenti)
async function startChallenge() {
  const allWords = Object.entries(state.vocab[state.lang]).flatMap(([cat,ws])=>ws.map(w=>({...w,cat})));
  if (allWords.length < 3) { showToast("Aggiungi almeno 3 parole per la sfida!", "info"); return; }
  state.showChallenge = { loading:true, data:null, step:0, userAnswers:[], score:null, current:"", mode:"existing" };
  render();
  try {
    const comuni = allWords.filter(w=>w.usage==="comune"||!w.usage);
    const pool = comuni.length >= 3 ? comuni : allWords;
    const picked = pool.sort(()=>Math.random()-0.5).slice(0,Math.min(5,pool.length));
    const wordDetails = picked.map(w=>{
      let info = '"'+w.word+'" ('+( w.translation||'?')+', cat:'+w.cat;
      if (w.gender) info += ', genere:'+w.gender;
      if (w.plural) info += ', plurale:'+w.plural;
      if (w.feminine) info += ', femminile:'+w.feminine;
      info += ')';
      return info;
    }).join('; ');
    const chlang = LC();
    const p = await callClaudeJSON(
      'Crea una mini sfida di '+chlang.target+' (max 5 domande, max 2 minuti) usando queste parole: '+wordDetails+'. '+
      'IMPORTANTE: usa forme VARIATE — plurali, femminili, verbi coniugati a tempi diversi (presente/passé composé/futur), non solo infinito o maschile singolare. '+
      'Scegli a caso tra: traduzione it→fr con forma specifica (es. "Come si dice vicinA?"), completamento frase con forma declinata/coniugata, trasformazione (es. "Metti al plurale: voisin"). '+
      'Rispondi SOLO JSON senza markdown: {"type":"string","title":"titolo breve","instructions":"istruzione in italiano max 1 riga","questions":[{"q":"domanda","a":"risposta esatta","hint":"aiuto opzionale"}]}'
    );
    state.showChallenge = { loading:false, data:p, step:0, userAnswers:[], score:null, current:"", mode:"existing" };
    render();
  } catch(e) {
    state.showChallenge = null;
    showToast(e.message==="no-key"?"⚙ Inserisci la chiave API nelle impostazioni":"Errore nella sfida","error");
    render();
  }
}

// ── SFIDA NUOVE PAROLE
async function startChallengeNew() {
  state.showChallenge = { loading:true, data:null, step:0, userAnswers:[], score:null, current:"", mode:"new" };
  render();
  try {
    // Collect words already known to exclude them
    const known = Object.values(state.vocab[state.lang]).flatMap(ws=>ws.map(w=>w.word.toLowerCase()));
    const knownStr = known.length > 0 ? 'Parole già note da escludere: '+known.slice(0,30).join(', ')+'. ' : '';
    const newlang = LC();
    const p = await callClaudeJSON(
      'Crea una mini lezione+sfida per imparare 4-5 parole in '+newlang.target+' nuove e comuni, utili nella vita quotidiana. '+
      knownStr+
      'Prima insegna le parole (includi traduzione, genere se sostantivo, esempio), poi fai 4-5 domande per testarle. '+
      'Varia le domande: traduzione, completamento frase, forma declinata/coniugata. '+
      'Rispondi SOLO JSON senza markdown: {"type":"nuove","title":"titolo breve","intro":"breve presentazione delle parole in italiano (una per riga: parola — traduzione — esempio)","questions":[{"q":"domanda","a":"risposta esatta","hint":"aiuto opzionale"}]}'
    );
    state.showChallenge = { loading:false, data:p, step:0, userAnswers:[], score:null, current:"", mode:"new", showIntro:true };
    render();
  } catch(e) {
    state.showChallenge = null;
    showToast(e.message==="no-key"?"⚙ Inserisci la chiave API nelle impostazioni":"Errore nella sfida","error");
    render();
  }
}

function submitAnswer() {
  const ch = state.showChallenge;
  if (!ch||!ch.data) return;
  const ans = (ch.current||"").trim();
  if (!ans) return;
  ch.userAnswers = ch.userAnswers||[];
  ch.userAnswers.push(ans);
  ch.current = "";
  if (ch.step < ch.data.questions.length-1) {
    ch.step++;
  } else {
    // Score
    let correct = 0;
    ch.data.questions.forEach((q,i)=>{
      const ua = (ch.userAnswers[i]||"").toLowerCase().trim();
      const ca = q.a.toLowerCase().trim();
      if (ua===ca || ua===ca.replace(/[^a-zàâçéèêëîïôùûüÿæœ ]/gi,'')) correct++;
    });
    ch.score = { correct, total:ch.data.questions.length };
  }
  render();
}

// ── RENDER
function render() {

  if (!state.lang) {
    let html = '<div style="min-height:100vh;background:#0f0e0c;display:flex;align-items:center;justify-content:center;padding:2rem">';
    html += '<div style="max-width:360px;width:100%;text-align:center">';
    html += '<div style="font-family:serif;font-size:2rem;color:#e8e0d0;margin-bottom:0.5rem">Vocabulaire</div>';
    html += '<div style="font-family:monospace;font-size:0.7rem;color:#555;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:3rem">Scegli la lingua</div>';
    html += '<div style="display:flex;flex-direction:column;gap:1rem">';
    html += '<button onclick="state.lang=\'fr\';saveLang(\'fr\');render()" style="background:#1a1814;border:1px solid #2a2820;border-radius:8px;padding:1.4rem;cursor:pointer;text-align:left;display:flex;align-items:center;gap:1rem">';
    html += '<span style="font-size:2.2rem">🇫🇷</span><div><div style="font-family:serif;font-size:1.2rem;color:#e8e0d0">Francese</div><div style="font-family:monospace;font-size:0.68rem;color:#666;margin-top:0.2rem">Mon Vocabulaire</div></div>';
    html += '</button>';
    html += '<button onclick="state.lang=\'en\';saveLang(\'en\');render()" style="background:#1a1814;border:1px solid #2a2820;border-radius:8px;padding:1.4rem;cursor:pointer;text-align:left;display:flex;align-items:center;gap:1rem">';
    html += '<span style="font-size:2.2rem">🇬🇧</span><div><div style="font-family:serif;font-size:1.2rem;color:#e8e0d0">Inglese</div><div style="font-family:monospace;font-size:0.68rem;color:#666;margin-top:0.2rem">My Vocabulary</div></div>';
    html += '</button>';
    html += '</div></div></div>';
    document.getElementById("app").innerHTML = html;
    return;
  }

  const total = totalWords();
  const activeCat = CATEGORIES.find(c=>c.id===state.activeTab);
  const words = filteredWords();
  let html = "";

  // HEADER
  html += '<div class="header"><div class="header-top">';
  html += '<div><div class="app-title">'+LC().appTitle+'</div><div class="app-subtitle">'+total+' '+(total===1?"parola":"parole")+' salvate</div></div>';
  html += '<div class="header-actions">';
  html += '<input class="search-field" type="text" placeholder="cerca…" value="'+esc(state.search)+'" oninput="state.search=this.value;render()" >';
  html += '<button class="btn-icon" onclick="state.showImportExport=true;render()">⇅ Salva/Carica</button>';
  html += '<button class="btn-flash" onclick="openFlashCards()">🃏 Flash</button>';
  html += '<button class="btn-text" onclick="openTextAnalysis()">📝 Testo</button>';
  html += '<button class="btn-camera" onclick="openPhotoAnalysis()">📷 Foto</button>';
  html += '<button class="btn-export-list" onclick="downloadList()">📄 PDF</button>';
  html += '<button class="btn-challenge" onclick="startChallenge()">🎯 Le mie parole</button>';
  html += '<button class="btn-challenge" style="border-color:#7ec9a055;color:#7ec9a0" onclick="startChallengeNew()">🌱 Parole nuove</button>';
  html += '<button class="btn-icon" onclick="state.lang=null;render()">'+LC().flag+'</button>';
  html += '<button class="btn-icon" onclick="state.showSettings=true;render()">⚙</button>';
  html += '</div></div></div>';

  // TABS
  if (!state.search) {
    html += '<div class="tabs">';
    CATEGORIES.forEach(cat => {
      const cnt = state.vocab[state.lang][cat.id].length;
      const active = cat.id===state.activeTab?" active":"";
      html += '<button class="tab'+active+'" style="color:'+(active?cat.color:"#555")+'" onclick="state.activeTab=\''+cat.id+'\';state.warning=null;render()">';
      html += cat.emoji+" "+cat.label+(cnt>0?'<span class="tab-count">('+cnt+')</span>':""+'')+'</button>';
    });
    html += '</div>';
  }

  // FORM
  if (!state.search) {
    html += '<div style="padding:1rem 1.2rem">';
    // mode toggle
    html += '<div class="mode-toggle">';
    html += '<button class="mode-btn'+(state.mode==="fr"?" active":"")+'" onclick="state.mode=\'fr\';state.warning=null;render()">'+LC().flag+' '+LC().inputMode_fr+'</button>';
    html += '<button class="mode-btn'+(state.mode==="it"?" active":"")+'" onclick="state.mode=\'it\';state.warning=null;render()">🇮🇹 Inserisci in italiano</button>';
    html += '</div>';
    html += '<div class="form-box">';
    html += '<div class="form-label" style="color:'+activeCat.color+'">'+activeCat.emoji+' Aggiungi a '+activeCat.label+'</div>';

    if (state.mode==="it") {
      // Italian mode — NO render() on oninput, use onblur to update button state via CSS trick
      html += '<div class="form-row">';
      html += '<input class="field" id="itWordInput" type="text" placeholder="Parola o frase in italiano *" value="'+esc(state.itWord)+'"'
            + ' oninput="state.itWord=this.value;document.getElementById(\'btnGenIt\').disabled=!this.value.trim()||'+state.generating+'"'
            + ' onkeydown="if(event.key===\'Enter\')generateFromItalian()">';
      html += '<button id="btnGenIt" class="btn-generate" onclick="generateFromItalian()" '+((!state.itWord.trim()||state.generating)?"disabled":"")+' >';
      html += state.generating ? '<span class="spinner"></span> …' : '✨ Traduci';
      html += '</button></div>';
      if (state.form.word) html += '<div style="font-family:monospace;font-size:0.68rem;color:#555;margin-bottom:0.5rem;padding:0.4rem 0.6rem;background:#1e1c18;border-radius:4px;">Risultato → rivedi i campi e premi Aggiungi</div>';
    } else {
      // French mode
      html += '<div class="form-row">';
      html += '<input class="field" id="frWordInput" type="text" placeholder="Parola in '+LC().target+' *" value="'+esc(state.form.word)+'"'
            + ' oninput="state.form.word=this.value;state.warning=null;document.getElementById(\'btnGenFr\').disabled=!this.value.trim()||'+state.generating+'"'
            + ' onkeydown="if(event.key===\'Enter\')addWord()">';
      html += '<button id="btnGenFr" class="btn-generate" onclick="generateFromFrench()" '+((!state.form.word.trim()||state.generating)?"disabled":"")+' >';
      html += state.generating ? '<span class="spinner"></span> …' : '✨ Genera';
      html += '</button></div>';
    }

    // Warning
    if (state.warning) {
      const isSp = state.warning.type==="spelling";
      html += '<div class="warning-box '+(isSp?"warning-spelling":"warning-category")+'">';
      html += '<span>'+(isSp?"⚠️":"💡")+'</span><div class="warning-text">';
      html += '<span style="color:'+(isSp?"#c98e7e":"#7eb8c9")+';text-transform:uppercase;letter-spacing:0.1em">'+(isSp?"Possibile errore:":"Categoria consigliata:")+' </span>';
      html += '<em>'+esc(state.warning.suggestion)+'</em>';
      if (isSp) html += '<button class="btn-use-correction" onclick="state.form.word=\''+esc(state.warning.suggestion)+'\';state.warning=null;render()">Usa questa</button>';
      html += '</div></div>';
    }

    html += '<input class="field" style="margin-bottom:0.5rem" type="text" placeholder="Traduzione italiana" value="'+esc(state.form.translation)+'" oninput="state.form.translation=this.value">';
    if (state.activeTab==="sostantivi") {
      html += '<div class="form-grid">';
      html += '<input class="field" type="text" placeholder="Genere" value="'+esc(state.form.gender)+'" oninput="state.form.gender=this.value">';
      html += '<input class="field" type="text" placeholder="Plurale" value="'+esc(state.form.plural)+'" oninput="state.form.plural=this.value">';
      html += '</div>';
    }
    if (state.activeTab==="aggettivi") {
      html += '<input class="field" style="margin-bottom:0.5rem" type="text" placeholder="Forma femminile" value="'+esc(state.form.feminine)+'" oninput="state.form.feminine=this.value">';
    }
    html += '<div class="form-row">';
    html += '<input class="field" type="text" placeholder="Esempi d\'uso" value="'+esc(state.form.example)+'" oninput="state.form.example=this.value" onkeydown="if(event.key===\'Enter\')addWord()">';
    html += '<button class="btn-add" onclick="addWord()" '+(!state.form.word.trim()?"disabled":"")+'>+ Aggiungi</button>';
    html += '</div>';
    html += '</div></div>';
  }

  // SEARCH LABEL
  if (state.search) html += '<div class="search-label">'+words.length+' risultat'+(words.length===1?"o":"i")+' per "'+esc(state.search)+'"</div>';

  // WORD LIST
  if (words.length===0) {
    html += '<div class="empty"><div class="empty-text">'+(state.search?"Nessun risultato":"Ancora nessuna parola")+'</div></div>';
  } else {
    html += '<div class="word-list">';
    words.forEach(w => {
      const cat = CATEGORIES.find(c=>c.id===w.cat);
      const examples = w.example ? w.example.split(" — ").filter(Boolean) : [];
      html += '<div class="word-card">';
      html += '<div class="word-head">';
      html += '<span class="word-fr">'+esc(w.word)+'</span>';
      if (w.translation) html += '<span class="word-it">— '+esc(w.translation)+'</span>';
      if (w.gender) html += '<span class="badge '+(w.gender==="femminile"?"badge-f":"badge-m")+'">'+(w.gender==="femminile"?"♀ f.":"♂ m.")+'</span>';
      if (w.plural)   html += '<span class="word-plural">pl. <em>'+esc(w.plural)+'</em></span>';
      if (w.feminine) html += '<span class="word-feminine">♀ <em>'+esc(w.feminine)+'</em></span>';
      if (w.usage)    html += usageBadge(w.usage);
      if (state.search && cat) html += '<span class="badge" style="color:'+cat.color+'">'+cat.emoji+' '+cat.label+'</span>';
      html += '</div>';
      examples.forEach(ex => { html += '<div class="word-example">« '+esc(ex)+' »</div>'; });
      // action bar + delete
      html += '<div class="word-footer">';
      html += '<div class="word-actions">';
      ['sinonimo','contrario','esempi','correggi'].forEach(a => {
        html += '<button class="btn-action" onclick="wordAction(\''+a+'\','+w.id+')">'+actionLabel(a)+'</button>';

      html += '</div>';

      html += '</div>';
      html += '<div class="word-date">'+esc(w.addedAt)+'</div>';
      html += '</div>';
    });
    html += '</div>';

  if (state.showWordModal) {
    const m = state.showWordModal;
    html += '<div class="overlay" onclick="state.showWordModal=null;render()">';
    html += '<div class="modal" onclick="event.stopPropagation()">';

    html += '<div class="modal-actions">';
    html += '<button class="btn-ghost" onclick="state.showImportExport=false;render()">Chiudi</button>';
    html += '<button class="btn-import" style="background:'+(state.importText.trim()?"#7ec9a0":"#333")+';color:'+(state.importText.trim()?"#0f0e0c":"#666")+'" onclick="importVocab()" '+(state.importText.trim()?"":"disabled")+'>↑ Carica lista</button>';
    html += '</div></div></div>';
  }

  // SETTINGS MODAL
  if (state.showSettings) {
    html += '<div class="overlay" onclick="state.showSettings=false;render()">';
    html += '<div class="modal" onclick="event.stopPropagation()">';
    html += '<div class="modal-title">Impostazioni</div>';
    html += '<div class="modal-subtitle">Inserisci la tua chiave API Anthropic per la generazione automatica.</div>';
    html += '<div class="settings-row"><div class="settings-label">Chiave API (sk-ant-...)</div>';
    html += '<input class="field" type="password" placeholder="sk-ant-api03-..." value="'+esc(state.apiKey)+'" oninput="state.apiKey=this.value;saveApiKey(this.value)">';
    html += '</div>';
    html += '<div style="font-family:monospace;font-size:0.65rem;color:#444;line-height:1.6;margin-bottom:1rem">Ottienila su console.anthropic.com — salvata automaticamente sul telefono.</div>';
    html += '<div class="modal-actions"><button class="btn-add" onclick="state.showSettings=false;render()">Chiudi</button></div>';
    html += '</div></div>';
  }

  // DELETE MODAL
  if (state.showDeleteConfirm) {
    const d = state.showDeleteConfirm;
    html += '<div class="overlay" onclick="state.showDeleteConfirm=null;render()">';
    html += '<div class="modal" onclick="event.stopPropagation()">';
    html += '<div class="modal-title">Elimina parola?</div>';
    html += '<div class="modal-subtitle">Rimuovi <span style="color:#d4a853">"'+esc(d.word)+'"</span>?</div>';
    html += '<div class="modal-actions">';
    html += '<button class="btn-ghost" onclick="state.showDeleteConfirm=null;render()">Annulla</button>';
    html += '<button class="btn-danger" onclick="deleteWord(\''+d.catId+'\','+d.wordId+')">Elimina</button>';
    html += '</div></div></div>';
  }

  document.getElementById("app").innerHTML = html;
  wirePhotoOverlay();
}

// Wire overlay close + file input listener AFTER the DOM exists,
// avoiding inline onclick/onchange which can misfire on mobile camera flows.
function wirePhotoOverlay() {
  const overlay = document.getElementById("photoOverlay");
  if (overlay) {
    overlay.addEventListener("click", function(e) {
      if (e.target === overlay) { state.showPhotoAnalysis = null; render(); }
    });
  }
  const photoInput = document.getElementById("photoInput");
  if (photoInput) {
    photoInput.addEventListener("change", function() { handlePhotoSelected(photoInput); }, { once: true });
  }
  const pdfInput = document.getElementById("pdfInput");
  if (pdfInput) {
    pdfInput.addEventListener("change", function() { handlePdfSelected(pdfInput); }, { once: true });
  }
  const textArea = document.getElementById("textInputArea");
  if (textArea) {
    textArea.addEventListener("input", function() {
      if (state.showTextAnalysis) state.showTextAnalysis.text = textArea.value;
      const btn = document.querySelector(".modal .btn-add");
      if (btn) btn.disabled = !textArea.value.trim();
    });
  }
}

loadState();
render();
</script>
